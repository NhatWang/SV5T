<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập hệ thống Quản trị viên - Sinh viên 5 tốt khoa Hóa học</title>
  <link rel="stylesheet" href="./css/admin-style.css" />
</head>
<body>
  <div class="admin-login-page">
    <div class="admin-login-card">
      <div class="admin-login-header">
        <h1>Quản trị SV5T</h1>
        <p>Đăng nhập tài khoản quản trị viên</p>
      </div>

      <div class="admin-login-form">
        <label for="adminUsername">Tên đăng nhập</label>
        <input
          type="text"
          id="adminUsername"
          placeholder="Nhập tên đăng nhập"
          autocomplete="username"
        />

        <label for="adminPassword">Mật khẩu</label>
        <div class="password-field">
          <input
            type="password"
            id="adminPassword"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
          />

          <button
            type="button"
            class="password-toggle"
            onclick="togglePassword('adminPassword', this)"
            aria-label="Hiện hoặc ẩn mật khẩu"
          >
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <button onclick="loginAdmin()">Đăng nhập</button>

        <p id="adminMessage"></p>
      </div>
    </div>
  </div>

  <footer class="site-footer auth-footer">
    <p>
      © 2026 SV5T Khoa Hóa học. Liên Chi Hội Khoa Hóa học.
    </p>
    <p>
      Phát triển nhằm hỗ trợ quá trình theo dõi và xét thưởng Sinh viên 5 tốt
    </p>
  </footer>

  <script src="./js/admin.js"></script>
</body>
</html>
